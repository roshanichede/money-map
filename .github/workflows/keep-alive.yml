# Render's free web services go to sleep after 15 minutes without traffic, and the first request then takes ~50s.
# This pings the API's health check every 14 minutes during UK and India waking hours so it stays awake.
# (Free GitHub Actions minutes are unlimited for public repositories.)
name: Keep the API awake

on:
  schedule:
    - cron: "*/14 3-23 * * *"   # 03:00–23:59 UTC ≈ 08:30 IST to midnight UK
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://moneymap-api-cppg.onrender.com/api/health
