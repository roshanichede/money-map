# Render Blueprint for the MoneyMap API (FastAPI). The website runs on Vercel, the database on Neon.
# In Render: New > Blueprint > pick this repo. It asks for DATABASE_URL and generates INTERNAL_API_SECRET.
services:
  - type: web
    name: moneymap-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL          # Neon connection string (postgresql://...)
        sync: false
      - key: INTERNAL_API_SECRET   # Render generates it; copy the same value to Vercel
        generateValue: true
